name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
      PLUS_STORE_GATE: 'false'
      E2E_BUILD: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Create Env.xcconfig
        run: |
          cat > ios/Config/Env.xcconfig << 'EOL'
          // This file contains environment-specific build settings.

          GOOGLE_WEB_CLIENT_ID = dummy-web-client-id.apps.googleusercontent.com
          REVERSED_GOOGLE_IOS_CLIENT_ID = com.googleusercontent.apps.dummy-ios-client-id

          EOL

      - name: Create dummy .env file for CI
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com

          # PalsHub/Supabase Configuration
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com

          # App Configuration
          APP_URL=pocketpal://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      - name: Create dummy GoogleService-Info.plist for CI
        run: |
          cat > ios/GoogleService-Info.plist << 'EOL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>dummy-client-id.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.dummy-client-id</string>
            <key>API_KEY</key>
            <string>dummy-api-key-for-ci-builds</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>ai.pocketpal</string>
            <key>PROJECT_ID</key>
            <string>dummy-project-for-ci</string>
            <key>STORAGE_BUCKET</key>
            <string>dummy-project-for-ci.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          EOL


      - name: Install CocoaPods dependencies
        run: cd ios && pod install
      - name: Select Xcode and ensure Metal toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun -sdk iphoneos metal -v || xcodebuild -downloadComponent MetalToolchain
      - name: Build unsigned device app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace ios/PocketPal.xcworkspace \
            -scheme PocketPal -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee ios-build.log
      - name: Verify ungated bundle and package IPA
        run: |
          set -euo pipefail
          APP=ios/build/Build/Products/Release-iphoneos/PocketPal.app
          test -d "$APP"
          scripts/verify-plus-gate.sh "$APP" --ungated
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PocketPal-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPal-unsigned-ipa
          path: PocketPal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
